# .github/workflows/bing-UHD-all.yml
name: bing-UHD-all

on:
  workflow_dispatch:
    inputs:
      year:
        description: "年份 (year)，留空默认当前年份"
        required: false
        default: ""
        type: string
  schedule:
    # 每天 0 点（UTC）自动运行
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: bing-UHD-all-${{ github.event.inputs.year || 'current' }}
  cancel-in-progress: false

jobs:
  download-and-build:
    name: Fetch JSON & Build UHD (${{ matrix.mkt }} / ${{ steps.year.outputs.YEAR }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # 某个市场失败不影响其他市场继续
      fail-fast: false
      # 串行执行，避免并发 push 冲突
      max-parallel: 1
      matrix:
        mkt:
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve year
        id: year
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR="$(date -u +%Y)"
          fi
          echo "YEAR=$YEAR" >> "$GITHUB_OUTPUT"
          echo "使用年份: $YEAR"

      - name: Run fetch & download script
        run: |
          python bing-UHD-all.py \
            --mkt "${{ matrix.mkt }}" \
            --year "${{ steps.year.outputs.YEAR }}"

      - name: Commit and push changes
        run: |
          YEAR="${{ steps.year.outputs.YEAR }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "bing-JSON-${{ matrix.mkt }}-${YEAR}.json" \
                  "bing-JSON-${{ matrix.mkt }}-${YEAR}" \
                  "bing-UHD-${{ matrix.mkt }}-${YEAR}" \
                  "bing-320-${{ matrix.mkt }}-${YEAR}" \
                  "bing-UHD-${{ matrix.mkt }}-${YEAR}}.md" || true

          if git diff --cached --quiet; then
            echo "没有变更需要提交。"
            exit 0
          fi

          git commit -m "chore: update bing UHD ${{ matrix.mkt }} ${YEAR} ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"

          # 带重试的 push，避免串行时因远端更新导致的 non-fast-forward
          for i in 1 2 3 4 5; do
            git push origin HEAD && break
            echo "push 失败，第 $i 次重试……"
            git pull --rebase origin HEAD || true
            sleep 5
          done
